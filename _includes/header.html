<header class="site-header">
  <div class="container header-inner">
    {% include logo.html variant="dark" %}
    <button class="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Menyu"><span></span><span></span></button>
    <nav id="nav" class="nav">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      <a class="btn btn-sm" href="{{ '/#aloqa' | relative_url }}">Bog'lanish</a>
    </nav>
  </div>
</header>
