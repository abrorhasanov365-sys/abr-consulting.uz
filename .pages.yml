# Pages CMS (https://app.pagescms.org) uchun sozlama: saytni brauzerdan tahrirlash paneli
media:
  input: assets/img
  output: /assets/img
content:
  - name: posts
    label: Yangiliklar
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, category, date]
    fields:
      - { name: title, label: Sarlavha, type: string, required: true }
      - { name: date, label: Sana, type: date }
      - name: category
        label: Turkum
        type: select
        options: { values: [Soliq, Buxgalteriya, Maslahat, Kompaniya, Qonunchilik] }
      - { name: summary, label: Qisqa tavsif, type: text }
      - { name: cover, label: Muqova rasmi, type: image }
      - { name: body, label: Matn, type: rich-text }
  - name: company
    label: Kompaniya ma'lumotlari
    type: file
    path: _data/company.yml
    fields:
      - { name: name, label: Nomi, type: string }
      - { name: tagline, label: Shior, type: string }
      - { name: hero_title, label: Bosh sarlavha, type: string }
      - { name: hero_text, label: Bosh matn, type: text }
      - { name: about, label: Biz haqimizda, type: text }
      - { name: phone, label: Telefon (ko'rinishi), type: string }
      - { name: phone_link, label: Telefon (raqam, bo'shliqsiz), type: string }
      - { name: email, label: Email, type: string }
      - { name: telegram, label: Telegram (@siz), type: string }
      - { name: instagram, label: Instagram (@siz), type: string }
      - { name: address, label: Manzil, type: string }
      - { name: hours, label: Ish vaqti, type: string }
      - { name: map_link, label: Xarita havolasi, type: string }
      - name: stats
        label: Raqamlar
        type: object
        list: true
        fields:
          - { name: value, label: Qiymat, type: string }
          - { name: label, label: Izoh, type: string }
  - name: services
    label: Xizmatlar
    type: file
    path: _data/services.yml
    list: true
    fields:
      - name: icon
        label: Belgi
        type: select
        options: { values: [ledger, tax, audit, ifrs, payroll, onec, shield, chart] }
      - { name: title, label: Nomi, type: string }
      - { name: text, label: Tavsif, type: text }
  - name: clients
    label: Mijozlar
    type: file
    path: _data/clients.yml
    list: true
    fields:
      - { name: name, label: Nomi, type: string }
      - { name: sector, label: Soha, type: string }
      - { name: logo, label: Logo, type: image }
  - name: testimonials
    label: Mijozlar fikri
    type: file
    path: _data/testimonials.yml
    list: true
    fields:
      - { name: text, label: Fikr, type: text }
      - { name: author, label: Muallif, type: string }
      - { name: company, label: Kompaniya, type: string }
  - name: team
    label: Jamoa
    type: file
    path: _data/team.yml
    list: true
    fields:
      - { name: name, label: Ism, type: string }
      - { name: role, label: Lavozim, type: string }
      - { name: photo, label: Rasm, type: image }
      - { name: bio, label: Qisqacha, type: text }
  - name: offer
    label: Tijorat taklifi
    type: file
    path: _data/offer.yml
    fields:
      - { name: intro, label: Kirish matni, type: text }
      - name: packages
        label: Tariflar
        type: object
        list: true
        fields:
          - { name: name, label: Nomi, type: string }
          - { name: for, label: Kim uchun, type: string }
          - { name: price, label: "Narx (bo'sh = Kelishiladi)", type: string }
          - { name: period, label: Davr, type: string }
          - { name: featured, label: Ajratib ko'rsatish, type: boolean }
          - { name: features, label: Imkoniyatlar, type: string, list: true }
      - { name: included, label: Barcha tariflarga kiradi, type: string, list: true }
      - name: steps
        label: Ishlash bosqichlari
        type: object
        list: true
        fields:
          - { name: title, label: Bosqich, type: string }
          - { name: text, label: Izoh, type: text }
